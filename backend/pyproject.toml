[project]
name = "cosmic-resolve"
version = "0.1.0"
description = "Starter architecture for the Cosmic Resolve hackathon prototype."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
bedrock = [
  "boto3>=1.35.0",
  "botocore[crt]>=1.35.0",  # required for `aws login` credentials
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",  # FastAPI TestClient
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../tests"]

[tool.setuptools]
packages = ["cosmic_resolve"]
