[project]
name = "cosmic-resolve"
version = "0.1.0"
description = "Starter architecture for the Cosmic Resolve hackathon prototype."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
bedrock = [
  "boto3>=1.35.0",
  "botocore[crt]>=1.35.0",  # required for `aws login` credentials
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",  # FastAPI TestClient
]
# Local-only voice intake (not installed on Vercel). piper-tts needs onnxruntime, which has no Python 3.15 wheel yet,
# so run the voice demo on Python 3.11-3.13. Bedrock access also needs the "bedrock" extra.
voice = [
  "httpx>=0.27.0",         # Groq speech-to-text calls
  "python-multipart>=0.0.9",  # FastAPI audio upload
  "piper-tts>=1.4.0",      # local text-to-speech
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../tests"]

[tool.setuptools]
packages = ["cosmic_resolve", "cosmic_resolve.voice"]
